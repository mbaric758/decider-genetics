services:

  # Step 1: Build the knowledge graph.
  build:
    image: docker.io/slobentanzer/biocypher-base:1.0.0
    container_name: build
    volumes:
      - biocypher_neo4j_volume:/usr/app/data # Create a volume for Neo4j data location.
      - .:/src/ # Mount the current directory to /src in the container.
    # Run the build script to create the import files.
    command:
      - /bin/bash
      - /src/scripts/build.sh

  # Step 2: Import the data into Neo4j.
  import:
    image: neo4j:4.4-enterprise
    container_name: import
    environment:
      NEO4J_AUTH: none
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      FILL_DB_ON_STARTUP: "yes"
    volumes:
      - biocypher_neo4j_volume:/data # Use the same volume for Neo4j data.
      - ./scripts/import.sh:/scripts/import.sh # Mount the import script.
    # Run the import script to load data into Neo4j. FIXME: There seems to be a chache issue here, with multiple edges appearing unless the container is removed and recreated.
    command:
      - /bin/bash
      - /scripts/import.sh
    depends_on:
      build:
        condition: service_completed_successfully

  # Step 3: Deploy the Neo4j database to localhost and for the next container.
  deploy:
    image: neo4j:4.4-enterprise
    container_name: deploy
    volumes:
      - biocypher_neo4j_volume:/data
    environment:
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_dbms_databases_default__to__read__only: "false"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    networks:
      - biochatter
    depends_on:
      import:
        condition: service_completed_successfully
  
  app:
    image: biocypher/biochatter-light:0.9.0
    container_name: app
    ports:
      - "8501:8501"
    networks:
      - biochatter
    depends_on:
      import:
        condition: service_completed_successfully
    environment:
      - GOOGLE_API_KEY=
      - DOCKER_COMPOSE=true
      - CHAT_TAB=false
      - PROMPT_ENGINEERING_TAB=false
      - RAG_TAB=false
      - CORRECTING_AGENT_TAB=false
      - KNOWLEDGE_GRAPH_TAB=true

volumes:
  biocypher_neo4j_volume:


networks:
  biochatter:

