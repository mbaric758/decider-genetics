row:
    map:
        columns:
            - patient_id
        to_subject: patient
transformers:
    - map:
        columns:
            - sample_id
        to_object: sample
        via_relation: patient_carries_sample
    - map:
        column: patient_id
        to_property: patient_id
        for_object: patient
    - map:
        columns:
            - alteration
        from_subject: sample
        to_object: alteration
        via_relation: sample_carries_alteration
    - map:
        columns:
          - alteration
        to_property: alteration_type
        for_object: alteration
    - map:
        columns:
            - hugoSymbol
        from_subject: alteration
        to_object: gene
        via_relation: alteration_affects_gene
    - map:
          columns:
              - mutationEffectDescription
          to_property:
              - mutation_effect_description
          for_objects:
              - alteration
    - cat_format:
          columns:
              - hugoSymbol
              - outcome
          from_subject: alteration
          to_object: functional_outcome
          format_string: "{hugoSymbol}:{outcome}"
          via_relation: alteration_causes_functional_outcome

metadata:
        - database_of_origin: single_nucleotide_variants